name: Build BEAM 3-case profile

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/build-3case.yml

permissions:
  contents: write

jobs:
  build-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate and validate datasets
        shell: bash
        run: |
          python - <<'PY'
          import copy
          import hashlib
          import json
          import subprocess
          from collections import Counter
          from pathlib import Path

          root = Path('.')
          indices = [0, 8, 16]
          source = json.loads((root / 'data/raw/beam_100K_all.json').read_text(encoding='utf-8'))
          selected = [source[index] for index in indices]
          raw_path = root / 'data/raw/beam_100K_3cases.json'
          raw_path.write_text(json.dumps(selected, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          config = {
              'chat_size': '100K',
              'source_case_indices': indices,
              'case_count': 3,
              'questions_per_case': 20,
              'total_questions': 60,
              'selection_reason': '覆盖 Coding、Writing Assistant & Learning、Lifestyle 三个差异领域',
          }
          (root / 'configs/sample_cases_3.json').write_text(json.dumps(config, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          converted_path = root / 'data/converted/beam_100K_3cases_locomo.json'
          subprocess.run(['python', 'scripts/convert_beam_to_locomo.py', str(raw_path), '-o', str(converted_path)], check=True)
          samples = json.loads(converted_path.read_text(encoding='utf-8'))
          assert len(samples) == 3
          assert sum(len(sample['qa']) for sample in samples) == 60
          counts = Counter(qa['question_type'] for sample in samples for qa in sample['qa'])
          assert len(counts) == 10 and set(counts.values()) == {6}, counts

          smoke_types = ['information_extraction', 'knowledge_update', 'temporal_reasoning']
          smoke = copy.deepcopy(samples)
          for sample, target_type in zip(smoke, smoke_types):
              sample['qa'] = [next(qa for qa in sample['qa'] if qa['question_type'] == target_type)]
          smoke_path = root / 'data/converted/beam_100K_3cases_smoke.json'
          smoke_path.write_text(json.dumps(smoke, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          docs = '''# BEAM 3-case 冒烟测试

本配置从官方 100K split 固定选择原始 case 索引 0、8、16，覆盖 Coding、Writing Assistant & Learning、Lifestyle。正式集为 3 cases / 60 QA，每种 BEAM question_type 6 题。

## 第一步：只跑3道题验证全链路

冒烟文件每个 case 只保留1题，分别覆盖 information_extraction、knowledge_update、temporal_reasoning：

```powershell
uv sync --extra dev
uv run python scripts/prepare_openclaw_eval.py data/converted/beam_100K_3cases_smoke.json --out generated-smoke
.\generated-smoke\run_commands.ps1
```

运行前复用已有 LoCoMo/LongMemEval 的 memory backend 配置和索引步骤。确认3个 workspace 均成功索引、3题均生成答案、无 session lock/reset 冲突、results.json 字段完整。

## 第二步：合并结果

每个 case 分别执行；以下以第一个为例：

```powershell
uv run python scripts/merge_openclaw_results.py generated-smoke/runs/beam-100K-0/results.json generated-smoke/judging/beam-100K-0.jsonl -o generated-smoke/answers/beam-100K-0.jsonl
```

## 第三步：单 Judge 冒烟评分

将3条答案交给一个固定 BEAM rubric judge。criterion 只能取 0、0.5、1；本步骤只验证评分格式和聚合脚本，不作为正式成绩。

```powershell
uv run python scripts/aggregate_beam_scores.py generated-smoke/scored/all.jsonl -o generated-smoke/summary.json
```

## 第四步：正式运行60题

前三步通过后运行正式集：

```powershell
uv run python scripts/prepare_openclaw_eval.py data/converted/beam_100K_3cases_locomo.json --out generated-3cases
.\generated-3cases\run_commands.ps1
```

每道 QA 使用独立 session。收到回答后不要立即 reset；建议等待 session idle 或全部问题完成后统一清理，并对 session lock 做指数退避重试。
'''
          (root / 'SMOKE_TEST_3CASES.md').write_text(docs, encoding='utf-8')

          readme_path = root / 'README.md'
          readme = readme_path.read_text(encoding='utf-8')
          marker = '## 推荐：低成本3-case版本'
          if marker not in readme:
              intro = '''## 推荐：低成本3-case版本

如果5 cases / 100 QA 成本过高，可使用 `data/converted/beam_100K_3cases_locomo.json`：3 cases / 60 QA，每种能力6题。先用 `data/converted/beam_100K_3cases_smoke.json` 跑3题单-Judge冒烟测试。完整步骤见 [SMOKE_TEST_3CASES.md](SMOKE_TEST_3CASES.md)。

'''
              readme = readme.replace('# BEAM → OpenClaw Eval 适配项目\n', '# BEAM → OpenClaw Eval 适配项目\n\n' + intro, 1)
              readme_path.write_text(readme, encoding='utf-8')

          paths = sorted(path for directory in (root / 'data/raw', root / 'data/converted') for path in directory.glob('*.json'))
          lines = []
          for path in paths:
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              lines.append(f'{digest}  {path.as_posix()}')
          (root / 'data/CHECKSUMS.sha256').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print('validated:', len(samples), 'cases, 60 QA,', dict(counts))
          PY

      - name: Commit generated files
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md SMOKE_TEST_3CASES.md configs/sample_cases_3.json data/raw/beam_100K_3cases.json data/converted/beam_100K_3cases_locomo.json data/converted/beam_100K_3cases_smoke.json data/CHECKSUMS.sha256
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'feat: add 3-case profile and smoke test'
            git push
          fi
